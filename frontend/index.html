<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="theme-color" content="#0F1923"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <meta name="description" content="QLekha - Window business quoting software. Design. Quote. Close."/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>QLekha — Design. Quote. Close.</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:#C4CDD8;border-radius:2px}
    input,select,textarea{font-family:Inter,sans-serif}
    a{transition:opacity 0.15s}
    /* Responsive list pattern: cards on phones, tables on wider screens */
    .qk-cards { display: grid; }
    .qk-table { display: none; }
    @media (min-width: 768px) {
      .qk-cards { display: none !important; }
      .qk-table { display: block !important; }
    }
    /* KPI grids: 2 across on phones instead of 1 giant card per row */
    .qk-kpi { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    @media (min-width: 768px) {
      .qk-kpi { grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 14px; }
    }
    /* Stop long words/numbers blowing out narrow cards */
    .qk-cards, .qk-kpi { min-width: 0; }
    .qk-cards * { min-width: 0; }
  </style>
</head>
<body style="margin:0;background:#F7F8FA">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
